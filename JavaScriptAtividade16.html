<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 8px;
            margin-left: 5px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #f4f4f4;
            margin: 8px auto;
            padding: 10px;
            width: 350px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .concluida span {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

    <h1>Lista de Tarefas</h1>


    <input type="text" id="inputTarefa" placeholder="Digite uma tarefa">
    <button id="btnAdicionar">Adicionar</button>


    <ul id="listaTarefas"></ul>

    <script>
        const input = document.getElementById("inputTarefa");
        const botao = document.getElementById("btnAdicionar");
        const lista = document.getElementById("listaTarefas");

        const STORAGE_KEY = "tarefas";


        function obterTarefas() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        }

        function salvarTarefas(tarefas) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tarefas));
        }


        function renderizar() {
            lista.innerHTML = "";
            const tarefas = obterTarefas();

            tarefas.forEach(tarefa => {
                const li = document.createElement("li");

                if (tarefa.concluida) {
                    li.classList.add("concluida");
                }


                const span = document.createElement("span");
                span.textContent = tarefa.titulo;


                span.addEventListener("click", () => {
                    tarefa.concluida = !tarefa.concluida;
                    salvarAtualizacao(tarefa.id, tarefa);
                });


                const btnEditar = document.createElement("button");
                btnEditar.textContent = "Editar";

                btnEditar.addEventListener("click", () => {
                    const novoTitulo = prompt("Editar tarefa:", tarefa.titulo);
                    if (novoTitulo) {
                        tarefa.titulo = novoTitulo;
                        salvarAtualizacao(tarefa.id, tarefa);
                    }
                });


                const btnRemover = document.createElement("button");
                btnRemover.textContent = "Remover";

                btnRemover.addEventListener("click", () => {
                    removerTarefa(tarefa.id);
                });

                const divBotoes = document.createElement("div");
                divBotoes.appendChild(btnEditar);
                divBotoes.appendChild(btnRemover);

                li.appendChild(span);
                li.appendChild(divBotoes);

                lista.appendChild(li);
            });
        }


        botao.addEventListener("click", () => {
            const titulo = input.value.trim();

            if (!titulo) return;

            const tarefas = obterTarefas();

            const novaTarefa = {
                id: Date.now(),
                titulo,
                concluida: false
            };

            tarefas.push(novaTarefa);
            salvarTarefas(tarefas);

            input.value = "";
            renderizar();
        });

        function salvarAtualizacao(id, novaTarefa) {
            let tarefas = obterTarefas();

            tarefas = tarefas.map(t =>
                t.id === id ? novaTarefa : t
            );

            salvarTarefas(tarefas);
            renderizar();
        }


        function removerTarefa(id) {
            let tarefas = obterTarefas();

            tarefas = tarefas.filter(t => t.id !== id);

            salvarTarefas(tarefas);
            renderizar();
        }

        renderizar();
    </script>

</body>

</html>

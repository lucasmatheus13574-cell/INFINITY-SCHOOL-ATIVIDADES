<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Lista de Usuários</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #f4f4f4;
            margin: 8px auto;
            padding: 10px;
            width: 300px;
            text-align: left;
            border-radius: 5px;
        }

        .erro {
            color: red;
            margin-top: 15px;
        }

        .loading {
            margin-top: 15px;
            color: #555;
        }
    </style>
</head>

<body>

    <h1>Usuários</h1>


    <button id="btnCarregar">Carregar Usuários</button>


    <p id="status"></p>


    <ul id="listaUsuarios"></ul>

    <script>
        const botao = document.getElementById("btnCarregar");
        const lista = document.getElementById("listaUsuarios");
        const status = document.getElementById("status");

        botao.addEventListener("click", async () => {
            status.textContent = "Carregando usuários...";
            status.className = "loading";
            lista.innerHTML = ""; 

            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users");


                if (!response.ok) {
                    throw new Error("Falha na resposta da API");
                }


                const usuarios = await response.json();

                status.textContent = ""; 


                usuarios.forEach(usuario => {
                    const li = document.createElement("li");

                    li.innerHTML = `
            <strong>Nome:</strong> ${usuario.name}<br>
            <strong>Email:</strong> ${usuario.email}
          `;

                    lista.appendChild(li);
                });

            } catch (erro) {
                console.error(erro);

                status.textContent = "Erro ao carregar os usuários, tente novamente mais tarde.";
                status.className = "erro";
            }
        });
    </script>

</body>

</html>
